<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Alpha Cybersecurity</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<style>
  .dash-topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 32px; border-bottom: 1px solid var(--border);
  }
  .dash-loading { padding: 80px 0; text-align: center; color: var(--text-2); font-size: 14px; }
  .admin-content { display: none; padding: 40px 0 80px; }

  .dash-tabs { display: flex; gap: 8px; border-bottom: 1px solid var(--border); margin-bottom: 32px; }
  .dash-tab {
    background: none; border: none; padding: 12px 4px; margin-right: 24px;
    font-size: 14px; font-weight: 700; color: var(--text-2);
    border-bottom: 2px solid transparent; transition: color .2s ease, border-color .2s ease;
  }
  .dash-tab:hover { color: var(--text-1); }
  .dash-tab.active { color: var(--text-0); border-bottom-color: var(--red); }
  .dash-view { display: none; }
  .dash-view.active { display: block; }

  .split { display: grid; grid-template-columns: 340px 1fr; gap: 28px; align-items: start; }
  @media (max-width: 860px) { .split { grid-template-columns: 1fr; } }

  .list-panel { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--panel); }
  .list-row {
    width: 100%; text-align: left; padding: 14px 16px; background: none; border: none;
    border-bottom: 1px solid var(--border); cursor: pointer; display: block;
  }
  .list-row:last-child { border-bottom: none; }
  .list-row:hover { background: rgba(255,255,255,0.03); }
  .list-row.active { background: rgba(232,72,63,0.08); border-left: 3px solid var(--red); }
  .list-row .row-title { font-size: 13.5px; font-weight: 700; color: var(--text-0); margin-bottom: 3px; }
  .list-row .row-sub { font-size: 11.5px; color: var(--text-2); }
  .row-status { display:inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; padding: 2px 7px; border-radius: 3px; margin-top: 6px; }
  .row-status.done { background: rgba(74,222,128,0.15); color: #4ade80; }
  .row-status.pending { background: rgba(232,72,63,0.15); color: var(--red); }

  .detail-panel { border: 1px solid var(--border); border-radius: 10px; padding: 28px; background: var(--panel); min-height: 200px; }
  .detail-empty { color: var(--text-2); font-size: 13.5px; text-align: center; padding: 40px 0; }
  .detail-panel h3 { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
  .detail-panel .detail-sub { font-size: 12.5px; color: var(--text-2); margin-bottom: 24px; }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .form-field label { display:block; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; color: var(--text-1); margin-bottom: 6px; }
  .form-field input, .form-field textarea {
    width: 100%; background: var(--bg-1); border: 1px solid var(--border); border-radius: 5px;
    padding: 10px 12px; color: var(--text-0); font-size: 13.5px; font-family: inherit;
  }
  .form-field input:focus, .form-field textarea:focus { outline: none; border-color: var(--red); }
  .checkbox-row { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .checkbox-row input { width: 16px; height: 16px; }
  .checkbox-row label { font-size: 13px; font-weight: 600; color: var(--text-1); }
  .form-note { font-size: 11.5px; color: var(--text-2); margin-top: 14px; }

  .thread { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; max-height: 420px; overflow-y: auto; }
  .msg { max-width: 78%; padding: 12px 16px; border-radius: 10px; font-size: 13.5px; line-height: 1.5; }
  .msg .msg-meta { font-size: 10.5px; color: var(--text-2); margin-top: 6px; letter-spacing: 0.3px; }
  .msg.admin { align-self: flex-end; background: linear-gradient(135deg, var(--red), var(--red-dark)); color: #0D0C0A; }
  .msg.admin .msg-meta { color: rgba(13,12,10,0.6); }
  .msg.client { align-self: flex-start; background: var(--bg-1); border: 1px solid var(--border); color: var(--text-0); }
  .msg-form { display: flex; gap: 10px; }
  .msg-form textarea {
    flex: 1; resize: none; background: var(--bg-1); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px; color: var(--text-0); font-family: inherit; font-size: 13.5px;
    min-height: 48px;
  }
  .msg-form textarea:focus { outline: none; border-color: var(--red); }
  .status-msg { font-size: 12.5px; margin-top: 12px; display: none; }
  .status-msg.show { display: block; }
  .status-msg.ok { color: #4ade80; }
  .status-msg.err { color: var(--red); }
</style>
</head>
<body>

<div class="dash-topbar">
  <div class="logo">
    <svg viewBox="0 0 150 210" xmlns="http://www.w3.org/2000/svg" style="width:24px;height:28px;">
      <g fill="none" stroke="#E8483F" stroke-width="7" stroke-linejoin="round">
        <path d="M10 30 L-15 -35 L45 5 Z"/>
        <path d="M110 30 L135 -35 L75 5 Z"/>
        <path d="M10 30 L45 5 L75 5 L110 30 L120 90 L95 130 L60 150 L25 130 L0 90 Z"/>
        <path d="M45 5 L60 70 L75 5"/>
        <path d="M0 90 L60 70 L120 90"/>
        <path d="M25 130 L60 70 L95 130"/>
        <path d="M40 130 L60 155 L80 130"/>
      </g>
    </svg>
    <div class="logo-text">
      <div class="name">ALPHA</div>
      <div class="sub">ADMIN PANEL</div>
    </div>
  </div>
  <div class="nav-actions">
    <a href="/" class="nav-login">&larr; Back to site</a>
    <button class="nav-cta" id="logoutBtn" style="border:none;">SIGN OUT</button>
  </div>
</div>

<div class="wrap">
  <div class="dash-loading" id="loadingState">Checking access…</div>

  <div class="admin-content" id="adminContent">
    <div class="dash-tabs">
      <button class="dash-tab active" data-view="clients">Clients</button>
      <button class="dash-tab" data-view="messages">Messages</button>
    </div>

    <div class="dash-view active" id="view-clients">
      <div class="split">
        <div class="list-panel" id="clientList"></div>
        <div class="detail-panel" id="clientDetail">
          <div class="detail-empty">Select a client to view and update their assessment.</div>
        </div>
      </div>
    </div>

    <div class="dash-view" id="view-messages">
      <div class="split">
        <div class="list-panel" id="threadList"></div>
        <div class="detail-panel" id="threadDetail">
          <div class="detail-empty">Select a conversation.</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
